    <!-- Schema.org Structured Data (JSON-LD) for Search Engines & AI Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://velemgyere.hu/#organization",
          "name": "Velem Gyere",
          "url": "https://velemgyere.hu/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://velemgyere.hu/brand/velemgyere-logo.jpg",
            "caption": "Velem Gyere Logo"
          },
          "description": "Külföldi magyar nyelvű élménytúrák, kirándulásszervezők és megbízható reptéri transzferek egyetlen közös platformon.",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "Customer Support",
            "availableLanguage": ["Hungarian", "English"]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://velemgyere.hu/#website",
          "url": "https://velemgyere.hu/",
          "name": "Velem Gyere",
          "publisher": {
            "@id": "https://velemgyere.hu/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://velemgyere.hu/programok?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
